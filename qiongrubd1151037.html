<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鄧氏瓊如 - 資訊專業簡歷</title>
    <style>
        /* 基礎與字體設定 */
        :root {
            --primary-color: #2563eb; /* 科技藍 */
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        /* 專業感卡片主體 */
        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }

        /* 照片放置處 (可點擊上傳) */
        .profile-photo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background-color: #f1f5f9;
            border: 3px dashed #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-photo:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #eff6ff;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            border: 3px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .profile-photo .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-size: 13px;
            z-index: 2;
        }

        .profile-photo:hover .overlay {
            opacity: 1;
        }

        /* 姓名與簡介 */
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .major {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .bio {
            color: var(--text-muted);
            font-size: 14px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            margin-bottom: 25px;
            line-height: 1.6;
            text-align: left;
        }

        /* 技能與興趣區塊 (專業標籤風格) */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tag {
            background-color: #eff6ff;
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #bfdbfe;
        }

        .tag.interest {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border-color: #e2e8f0;
        }

        /* 聯絡方式 */
        .contact {
            text-align: left;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-label {
            font-weight: 600;
            color: var(--text-main);
            width: 90px;
            display: inline-block;
        }

        .contact-value {
            color: var(--text-muted);
            word-break: break-all;
        }

        /* 小圖示 SVG (使用簡單字元替代或可自行加入 FontAwesome) */
        .icon {
            font-family: monospace;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 照片上傳區塊 -->
        <label for="upload-input" class="profile-photo">
            <span id="placeholder-text" style="text-align: center; line-height: 1.4;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 5px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg><br>
                上傳照片<br>(Tải ảnh lên)
            </span>
            <img id="photo-preview" src="" alt="瓊如的照片">
            <div class="overlay">更換照片</div>
        </label>
        <input type="file" id="upload-input" accept="image/*" style="display: none;">

        <!-- 基本資訊 -->
        <h1>鄧氏瓊如</h1>
        <p class="major">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            黎明技術學院 數媒系
        </p>
        <div class="bio">
            「喜歡簡單生活，也喜歡認真對待每一件事。」
        </div>

        <!-- 專業技能 -->
        <div class="section-title">💻 專業技能 (Skills)</div>
        <div class="tags-container">
            <span class="tag">程式撰寫 (Coding)</span>
            <span class="tag">微積分 (Calculus)</span>
            <span class="tag">資訊科技 (IT)</span>
        </div>

        <!-- 個人興趣 -->
        <div class="section-title">☕ 興趣與生活 (Interests)</div>
        <div class="tags-container">
            <span class="tag interest">閱讀 (Reading)</span>
            <span class="tag interest">休息充電 (Sleeping)</span>
        </div>

        <!-- 聯絡資訊 -->
        <div class="contact">
            <div class="section-title" style="margin-bottom: 15px;">📞 聯絡方式 (Contact)</div>
            <div class="contact-item">
                <span class="contact-label">Email</span>
                <span class="contact-value">bd1151037@venus.lit.edu.tw</span>
            </div>
            <div class="contact-item">
                <span class="contact-label">Line ID</span>
                <span class="contact-value">nguyennhu0607</span>
            </div>
            <div class="contact-item">
                <span class="contact-label">Instagram</span>
                <span class="contact-value">baequynhnhu</span>
            </div>
        </div>
    </div>

    <!-- JavaScript：處理圖片上傳與預覽 -->
    <script>
        const uploadInput = document.getElementById('upload-input');
        const photoPreview = document.getElementById('photo-preview');
        const placeholderText = document.getElementById('placeholder-text');

        uploadInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    photoPreview.src = e.target.result;
                    photoPreview.style.display = 'block'; 
                    placeholderText.style.display = 'none'; 
                }
                
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
