<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曹亦天 | 專業個人主頁</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
        }
        /* 淺色科技感網格背景 */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(148, 163, 184, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6 bg-grid text-slate-800 selection:bg-blue-200 selection:text-blue-900">

    <!-- 主容器：寬版排版，提升專業感 -->
    <main class="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200 relative">

        <div class="h-2 bg-gradient-to-r from-blue-600 via-cyan-500 to-blue-400 w-full"></div>

                    </p>

                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">

                            </p>
                        </div>

                    <!-- 專業技能區塊 (新增) -->
                    <section>
                        <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-code-branch text-slate-300"></i> Technical Skills
                        </h2>
                        <div class="flex flex-wrap gap-2">
                            <span class="px-3 py-1.5 bg-white border border-slate-200 text-slate-600 text-xs font-bold rounded-lg shadow-sm hover:border-blue-400 hover:text-blue-600 transition-colors cursor-default">數位多媒體設計</span>

                        </div>

                    <!-- 聯絡方式區塊 -->
                    <section>
                        <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">

                                </div>

                                    <p class="text-[11px] text-slate-400 font-bold">Email</p>
                                    <p class="text-sm font-bold text-slate-700 truncate">bd1151009@venus...</p>

                                    <i class="fa-brands fa-line"></i>

                                <div class="text-left">
                                    <p class="text-[11px] text-slate-400 font-bold">Line ID</p>
                                    <p class="text-sm font-bold text-slate-700">areeyaa_2</p>

                            </div>

                            <!-- Instagram -->
                            <a href="https://instagram.com/jan212550" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:border-pink-400 hover:shadow-md transition-all group sm:col-span-2">
                                <div class="w-10 h-10 rounded-lg bg-slate-50 text-slate-400 flex items-center justify-center text-xl group-hover:bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-500 group-hover:text-white transition-colors">
                                    <i class="fa-brands fa-instagram"></i>
                                </div>
                                <div class="text-left">
                                    <p class="text-[11px] text-slate-400 font-bold">Instagram</p>
                                    <p class="text-sm font-bold text-slate-700">@jan212550</p>
                                </div>

                </div>
            </div>
        </div>
